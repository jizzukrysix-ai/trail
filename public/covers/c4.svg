<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170810"/>
      <stop offset="1" stop-color="#3d1126"/>
    </linearGradient>
    <radialGradient id="g0" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb3c6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb3c6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8fb1" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff8fb1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b8426e" stop-opacity=".6"/>
      <stop offset="1" stop-color="#b8426e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".62"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity=".95">
    <circle cx="191" cy="331" r="305" fill="url(#g0)"/>
    <circle cx="932" cy="473" r="352" fill="url(#g1)"/>
    <circle cx="634" cy="681" r="181" fill="url(#g2)"/>
  </g>
  <g>
    <circle cx="600" cy="400" r="220.2" fill="none" stroke="#ffb3c6" stroke-opacity="0.26" stroke-width="1.4"/>
    <circle cx="600" cy="400" r="338.4" fill="none" stroke="#ffb3c6" stroke-opacity="0.20" stroke-width="1.4"/>
    <circle cx="600" cy="400" r="439.1" fill="none" stroke="#ffb3c6" stroke-opacity="0.14" stroke-width="1.4"/>
  </g>
  <g stroke="#ffb3c6" stroke-opacity=".10" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="60"/><line x1="0" y1="188" x2="1200" y2="144"/><line x1="0" y1="276" x2="1200" y2="228"/><line x1="0" y1="364" x2="1200" y2="312"/><line x1="0" y1="452" x2="1200" y2="396"/><line x1="0" y1="540" x2="1200" y2="480"/><line x1="0" y1="628" x2="1200" y2="564"/><line x1="0" y1="716" x2="1200" y2="648"/>
  </g>
  <g><circle cx="96" cy="208" r="2.2" fill="#ffb3c6" fill-opacity=".38"/><circle cx="544" cy="152" r="1.5" fill="#ffb3c6" fill-opacity=".38"/><circle cx="600" cy="544" r="1.3" fill="#ffb3c6" fill-opacity=".38"/><circle cx="600" cy="656" r="1.4" fill="#ffb3c6" fill-opacity=".38"/><circle cx="656" cy="712" r="1.1" fill="#ffb3c6" fill-opacity=".38"/><circle cx="712" cy="656" r="1.5" fill="#ffb3c6" fill-opacity=".38"/><circle cx="768" cy="96" r="2.3" fill="#ffb3c6" fill-opacity=".38"/><circle cx="824" cy="96" r="1.1" fill="#ffb3c6" fill-opacity=".38"/><circle cx="824" cy="432" r="2.4" fill="#ffb3c6" fill-opacity=".38"/><circle cx="880" cy="264" r="1.2" fill="#ffb3c6" fill-opacity=".38"/><circle cx="936" cy="96" r="1.4" fill="#ffb3c6" fill-opacity=".38"/><circle cx="936" cy="712" r="1.4" fill="#ffb3c6" fill-opacity=".38"/><circle cx="1048" cy="768" r="2.4" fill="#ffb3c6" fill-opacity=".38"/><circle cx="1160" cy="320" r="1.8" fill="#ffb3c6" fill-opacity=".38"/></g>
  <rect width="1200" height="800" fill="url(#sheen)"/>
  <rect width="1200" height="800" fill="url(#vignette)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
