<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050e1b"/>
      <stop offset="1" stop-color="#0f2b4d"/>
    </linearGradient>
    <radialGradient id="g0" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5d2ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a5d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5fb6ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#5fb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#27568f" stop-opacity=".6"/>
      <stop offset="1" stop-color="#27568f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".62"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity=".95">
    <circle cx="300" cy="200" r="388" fill="url(#g0)"/>
    <circle cx="735" cy="644" r="223" fill="url(#g1)"/>
    <circle cx="789" cy="645" r="320" fill="url(#g2)"/>
  </g>
  <g>
    <circle cx="600" cy="400" r="217.1" fill="none" stroke="#a5d2ff" stroke-opacity="0.26" stroke-width="1.4"/>
    <circle cx="600" cy="400" r="336.9" fill="none" stroke="#a5d2ff" stroke-opacity="0.20" stroke-width="1.4"/>
    <circle cx="600" cy="400" r="449.4" fill="none" stroke="#a5d2ff" stroke-opacity="0.14" stroke-width="1.4"/>
  </g>
  <g stroke="#a5d2ff" stroke-opacity=".10" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="60"/><line x1="0" y1="188" x2="1200" y2="144"/><line x1="0" y1="276" x2="1200" y2="228"/><line x1="0" y1="364" x2="1200" y2="312"/><line x1="0" y1="452" x2="1200" y2="396"/><line x1="0" y1="540" x2="1200" y2="480"/><line x1="0" y1="628" x2="1200" y2="564"/><line x1="0" y1="716" x2="1200" y2="648"/>
  </g>
  <g><circle cx="544" cy="208" r="1.2" fill="#a5d2ff" fill-opacity=".38"/><circle cx="712" cy="768" r="1.7" fill="#a5d2ff" fill-opacity=".38"/><circle cx="768" cy="600" r="2.2" fill="#a5d2ff" fill-opacity=".38"/><circle cx="880" cy="96" r="2.3" fill="#a5d2ff" fill-opacity=".38"/><circle cx="880" cy="656" r="1.5" fill="#a5d2ff" fill-opacity=".38"/></g>
  <rect width="1200" height="800" fill="url(#sheen)"/>
  <rect width="1200" height="800" fill="url(#vignette)"/>
  <rect width="1200" height="800" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>
